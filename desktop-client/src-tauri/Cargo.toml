[package]
name = "execgo-playground-desktop"
version = "0.1.0"
description = "Desktop client for ExecGo Playground"
authors = ["ExecGo Playground"]
edition = "2021"

[lib]
name = "execgo_playground_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
