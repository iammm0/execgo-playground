[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execgo-playground"
version = "0.1.0"
description = "AI orchestration reliability experiment platform for ExecGo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
frameworks = [
  "langgraph>=0.2,<1",
  "crewai>=0.80,<1",
  "pyautogen>=0.4,<1",
]

[project.scripts]
execgo-playground = "execgo_playground.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
